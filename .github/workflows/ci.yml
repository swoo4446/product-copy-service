# CI/CD 전체 파이프라인
# 필요한 Secrets: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / ECR_REGISTRY / EC2_HOST / EC2_SSH_KEY
name: CI-CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 테스트 실행
        # 커버리지 85% 미만이면 테스트가 모두 통과해도 실패 → 테스트를 지우는 변경을 막는다
        run: pytest -q --cov=app --cov-fail-under=85

  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Docker 이미지 빌드 (빌드 가능 여부만 검증)
        run: docker build -t product-copy-service:${{ github.sha }} .

  deploy:
    needs: build
    # PR에서는 배포하지 않는다 — main에 push됐을 때만
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: ECR 로그인
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드·ECR 푸시
        run: |
          docker build -t ${{ steps.ecr.outputs.registry }}/product-copy-repository:latest .
          docker push ${{ steps.ecr.outputs.registry }}/product-copy-repository:latest

      - name: EC2 배포 (새 컨테이너로 교체)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            # User Data가 돌지 않은 인스턴스도 배포되게 Docker·AWS CLI가 없으면 설치한다 (있으면 건너뜀)
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get -o DPkg::Lock::Timeout=300 update -y
              sudo apt-get -o DPkg::Lock::Timeout=300 install -y docker.io
              sudo systemctl enable --now docker
              sudo usermod -aG docker ubuntu
            fi
            if [ ! -x /snap/bin/aws ]; then
              sudo snap install aws-cli --classic
            fi
            # SSH 비대화형 세션은 PATH에 /snap/bin이 없고, 방금 추가한 docker 그룹도 적용되지 않아 전체 경로와 sudo를 쓴다
            AWS=/snap/bin/aws
            $AWS ecr get-login-password --region ap-northeast-2 | sudo docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
            sudo docker pull ${{ secrets.ECR_REGISTRY }}/product-copy-repository:latest
            sudo docker stop product-copy-service || true
            sudo docker rm product-copy-service || true
            # Day 7과 같은 옵션으로 띄운다 — 포트 80(보안 그룹이 연 포트), 자동 재시작, 운영 환경 변수
            sudo docker run -d --name product-copy-service --restart=always -p 80:8000 -e APP_ENV=production ${{ secrets.ECR_REGISTRY }}/product-copy-repository:latest
